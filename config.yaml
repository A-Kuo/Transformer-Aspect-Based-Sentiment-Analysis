# ============================================================
# BERT Aspect-Based Sentiment Analysis — Configuration
# ============================================================
# All hyperparameters and paths in one place.
# Override via CLI: python main.py --config config.yaml

# --- Model ---
model:
  name: "bert-base-uncased"          # HuggingFace model ID
  num_aspect_labels: 5               # Product aspects to detect
  num_sentiment_labels: 3            # negative / neutral / positive
  max_seq_length: 256                # Token limit (covers 95%+ of reviews)
  dropout: 0.1

# --- Aspect label definitions ---
# These map integer IDs to human-readable aspect categories.
# The model's aspect head outputs a probability over these.
aspects:
  0: "quality"          # Build quality, materials, durability
  1: "usability"        # Ease of use, UX, setup experience
  2: "value"            # Price-to-quality ratio, deals
  3: "shipping"         # Delivery speed, packaging
  4: "customer_service" # Support, returns, responsiveness

# --- Sentiment label definitions ---
sentiments:
  0: "negative"
  1: "neutral"
  2: "positive"

# --- Data ---
data:
  dataset_name: "McAuley-Lab/Amazon-Reviews-2023"
  dataset_subset: "raw_review_All_Beauty"   # Start small; swap for larger category later
  train_size: 5000                          # Phase 1 prototype size
  val_size: 1000
  test_size: 500
  seed: 42

# --- Training ---
training:
  epochs: 3
  batch_size: 16
  learning_rate: 2.0e-5          # Standard BERT fine-tuning LR
  weight_decay: 0.01
  warmup_ratio: 0.1              # 10% of steps for LR warmup
  fp16: true                     # Mixed-precision (2x speedup on GPU)
  gradient_accumulation_steps: 2 # Effective batch = 16 * 2 = 32
  save_strategy: "epoch"
  eval_strategy: "epoch"
  early_stopping_patience: 2
  # Amazon reviews skew heavily positive (most ratings are 4-5 stars), so
  # stars_to_sentiment's label distribution is naturally imbalanced.
  # Without this, training collapses into mostly predicting "positive"
  # regardless of input. See src/data.py::compute_class_weights.
  class_weighted_loss: true

# --- Inference ---
inference:
  batch_size: 32
  device: "auto"                 # auto-detect GPU/CPU

# --- Paths ---
paths:
  data_dir: "data/"
  model_dir: "models/"
  results_dir: "results/"
  logs_dir: "results/logs/"

# --- Success criteria / target metrics (Phase 2) ---
# Engineering sanity thresholds for THIS project's specific setup —
# bert-base-uncased, weak-supervision labels (keyword-matched aspects,
# star-rating-derived sentiment), a ~5-6K review Amazon subset, 3 epochs.
# These are NOT generic industry ABSA benchmarks: published numbers for
# domain-adapted models (FinBERT/ClinicalBERT on financial/clinical text)
# use much larger domain-specific corpora and often cleaner labels, so
# they aren't a fair comparison for a weak-supervision prototype on
# general product reviews. Treat these as a first-pass hypothesis to
# check against real results (see notebooks/kaggle_train_and_push.ipynb
# and app.py's "Model Info" page), and recalibrate once real numbers
# land — not a claim about state-of-the-art performance.
#
# "floor" = minimum bar; below this, something is likely broken (a
# labeling bug, a training loop bug, class weights not applying).
# "target" = aspirational bar for a healthy run given this setup's known
# constraints (label noise, small dataset, few epochs).
monitoring:
  latency_ceiling_ms: 500        # p99 latency SLA
  drift_check_interval_hours: 24

  # Aspect classification (5-way, weak-supervision keyword labels — the
  # noisier of the two signals, so the ceiling is set lower).
  aspect_accuracy_floor: 0.55
  aspect_accuracy_target: 0.70
  aspect_macro_f1_floor: 0.45
  aspect_macro_f1_target: 0.60

  # Sentiment classification (3-way, star-rating-derived labels — a
  # cleaner signal than the aspect labels, but skewed positive; see
  # training.class_weighted_loss above).
  sentiment_accuracy_floor: 0.70
  sentiment_accuracy_target: 0.82
  sentiment_macro_f1_floor: 0.60
  sentiment_macro_f1_target: 0.75
  # Per-class recall floors. Positive recall is "free" from the label
  # skew even for a lazy model — negative/neutral recall are the real
  # evidence that class-weighted loss is actually working.
  sentiment_negative_recall_floor: 0.60
  sentiment_neutral_recall_floor: 0.45
  sentiment_positive_recall_floor: 0.70
