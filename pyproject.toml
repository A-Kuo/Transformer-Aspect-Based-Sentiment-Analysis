[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-transformer-analysis"
version = "0.1.0"
description = "BERT aspect-based sentiment analysis on product reviews"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "datasets>=2.14.0",
    "accelerate>=0.24.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.4.0",
    "pre-commit>=3.6.0",
]
# V3 hybrid SSM stack: optional; requires CUDA-capable PyTorch on many platforms.
# Without these, V3 falls back to a depthwise-conv + FFN block (CPU-friendly).
v3 = [
    "mamba-ssm>=2.2.0",
    "causal-conv1d>=1.4.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
]
app = [
    "streamlit>=1.38.0",
    "altair>=5.0.0",
]
# Neon-backed model registry (src/db.py) + Hugging Face Hub weight
# delivery: used by app.py (optional — falls back gracefully if
# unavailable) and by scripts/load_absa_results.py (required).
db = [
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "python-dotenv>=1.0.0",
    "huggingface_hub>=0.24.0",
]

[project.scripts]
bert-sentiment = "main:main"

[tool.setuptools.packages.find]
include = ["src*", "V2*", "V3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
