[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-transformer-analysis"
version = "0.1.0"
description = "BERT aspect-based sentiment analysis on product reviews"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "datasets>=2.14.0",
    "accelerate>=0.24.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.4.0",
    "pre-commit>=3.6.0",
]
# V3 hybrid SSM stack: optional; requires CUDA-capable PyTorch on many platforms.
# Without these, V3 falls back to a depthwise-conv + FFN block (CPU-friendly).
v3 = [
    "mamba-ssm>=2.2.0",
    "causal-conv1d>=1.4.0",
]

[project.scripts]
bert-sentiment = "main:main"

[tool.setuptools.packages.find]
include = ["src*", "V3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"V3/test_hybrid.py" = ["E402"]
